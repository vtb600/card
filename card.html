<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo Card Visit VietinBank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f7fb;--surface:#fff;--text:#1d2b3a;--muted:#5d6b7a;--line:#d5dde8;--accent:#2a5c93;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a24;--surface:#1b2634;--text:#e6edf5;--muted:#9aa9ba;--line:#2e3d50;--accent:#6aa6e6}}
:root[data-theme="dark"]{--bg:#121a24;--surface:#1b2634;--text:#e6edf5;--muted:#9aa9ba;--line:#2e3d50;--accent:#6aa6e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px}
@media(min-width:860px){.wrap{grid-template-columns:340px 1fr;align-items:start}}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.row{display:flex;gap:8px}.row>div{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
#out{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);display:block}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
<h1>Tạo card visit VietinBank</h1>
<p class="sub">Nhập thông tin, hình thẻ cập nhật ngay.</p>
<label>Họ và tên</label><input id="name" value="Trần Văn Thắng">
<label>Chức danh</label><input id="title" value="Giám đốc PGD Hàm Tân">
<label>Chi nhánh</label><input id="branch" value="Chi nhánh Bình Thuận">
<label>Phòng / Đơn vị</label><input id="unit" value="Phòng giao dịch Hàm Tân">
<label>Địa chỉ</label><input id="addr" value="153N Lê Lợi, phường Phước Hội, tỉnh Lâm Đồng">
<div class="row"><div><label>Điện thoại bàn (P)</label><input id="phone" value="0252 3842 344"></div>
<div><label>Di động (M)</label><input id="mobile" value="0945 929 492"></div></div>
<label>Email (E)</label><input id="email" value="thangtv2@vietinbank.vn">
<label>Website</label><input id="web" value="www.vietinbank.vn">
<label>Mẫu thẻ trống (ảnh nền đúng thương hiệu)</label>
<input type="file" id="tpl" accept="image/*">
<div id="adj" hidden>
<label>Dịch ngang</label><input type="range" id="xo" min="-300" max="300" value="0">
<label>Dịch dọc</label><input type="range" id="yo" min="-300" max="300" value="0">
<label>Cỡ chữ</label><input type="range" id="sz" min="60" max="140" value="100">
<div class="btns"><button id="btnRm">Bỏ mẫu đã nhập</button></div>
</div>
<p class="hint">Chọn ảnh thẻ chưa có thông tin: chữ sẽ được in lên ảnh đó, logo và nền giữ nguyên bản gốc. Dùng thanh trượt để chỉnh vị trí cho khớp.</p>
<div class="btns">
<button class="p" id="btnEn">Chuyển sang bản tiếng Anh (bỏ dấu)</button>
<button id="btnVi">Mẫu tiếng Việt</button>
</div>
</div>
<div class="panel">
<canvas id="cv" width="1100" height="680" hidden></canvas>
<img id="out" alt="Card visit">
<p class="hint">Lưu ảnh: nhấn giữ vào hình (điện thoại) hoặc chuột phải → Lưu hình ảnh (máy tính).</p>
</div>
</div>
<script>
(function(){
var ids=["name","title","branch","unit","addr","phone","mobile","email","web"];
var el={};ids.forEach(function(i){el[i]=document.getElementById(i)});
var bg=null;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d"),out=document.getElementById("out");
var F='"Be Vietnam Pro",system-ui,sans-serif',BLUE="#005f96",RED="#d0334a";
var VI={name:"Trần Văn Thắng",title:"Giám đốc PGD Hàm Tân",branch:"Chi nhánh Bình Thuận",unit:"Phòng giao dịch Hàm Tân",addr:"153N Lê Lợi, phường Phước Hội, tỉnh Lâm Đồng"};
function strip(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D")}
function emblem(cx,cy,r){
ctx.fillStyle=BLUE;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#aedff7";ctx.beginPath();ctx.ellipse(cx,cy+r*0.28,r*0.78,r*0.34,0,0,Math.PI);ctx.fill();
ctx.fillStyle="#d0334a";ctx.beginPath();ctx.ellipse(cx,cy+r*0.38,r*0.72,r*0.3,0,0,Math.PI);ctx.fill();
}
function draw(){
var x=100,W,H;
if(bg){cv.width=W=bg.naturalWidth;cv.height=H=bg.naturalHeight;ctx.drawImage(bg,0,0)}else{cv.width=W=1100;cv.height=H=680}
if(!bg){
ctx.fillStyle="#aedff7";ctx.fillRect(0,0,W,H);
var g=ctx.createLinearGradient(0,0,W,0);
g.addColorStop(0,"#4aa9df");g.addColorStop(.4,"#2f5f98");g.addColorStop(.7,"#8a4a6a");g.addColorStop(1,"#d23c48");
ctx.fillStyle=g;ctx.fillRect(0,H-62,W,62);
ctx.textBaseline="alphabetic";
ctx.fillStyle=BLUE;ctx.font="600 58px "+F;
ctx.fillText("VietinBank",590,170);
emblem(990,100,52);
}
var k=W/1100,s=+document.getElementById("sz").value/100;
ctx.save();ctx.scale(k,k);
ctx.translate(+document.getElementById("xo").value,+document.getElementById("yo").value);
ctx.translate(100,240);ctx.scale(s,s);ctx.translate(-100,-240);
ctx.textBaseline="alphabetic";ctx.fillStyle=BLUE;
ctx.font="600 44px "+F;ctx.fillText(el.name.value,x,262);
ctx.font="400 30px "+F;ctx.fillText(el.title.value,x,312);
ctx.font="600 25px "+F;
var b=el.branch.value;ctx.fillText(b,x,415);
var w=ctx.measureText(b).width;
if(el.unit.value){ctx.fillText("|  "+el.unit.value,x+w+14,415)}
ctx.font="400 25px "+F;ctx.fillText(el.addr.value,x,455);
ctx.font="400 27px "+F;
ctx.fillStyle=RED;ctx.fillText("P",x,510);ctx.fillText("M",x+300,510);ctx.fillText("E",x,552);
ctx.fillStyle=BLUE;ctx.fillText(el.phone.value,x+42,510);ctx.fillText(el.mobile.value,x+342,510);ctx.fillText(el.email.value,x+42,552);
if(!bg){ctx.font="600 24px "+F;ctx.fillText(el.web.value,x,596)}
ctx.restore();
out.src=cv.toDataURL("image/png");
}
ids.forEach(function(i){el[i].addEventListener("input",draw)});
document.getElementById("btnEn").onclick=function(){
["name","title","branch","unit","addr"].forEach(function(k){
var v=strip(el[k].value);
if(k==="title")v=v.replace(/Giam doc PGD (.+)/,"Manager of $1 Transaction Office");
if(k==="branch")v=v.replace(/Chi nhanh (.+)/,"$1 Branch");
if(k==="unit")v=v.replace(/Phong giao dich (.+)/,"$1 Transaction Office");
if(k==="addr")v=v.replace(/phuong /i,"").replace(/tinh /i,"");
el[k].value=v});draw()};
document.getElementById("btnVi").onclick=function(){for(var k in VI)el[k].value=VI[k];draw()};
["xo","yo","sz"].forEach(function(i){document.getElementById(i).addEventListener("input",draw)});
document.getElementById("tpl").addEventListener("change",function(e){
var f=e.target.files&&e.target.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){bg=im;document.getElementById("adj").hidden=false;draw()};im.src=r.result};
r.readAsDataURL(f)});
document.getElementById("btnRm").onclick=function(){bg=null;document.getElementById("tpl").value="";document.getElementById("adj").hidden=true;["xo","yo"].forEach(function(i){document.getElementById(i).value=0});document.getElementById("sz").value=100;draw()};
draw();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load("400 20px 'Be Vietnam Pro'"),document.fonts.load("600 20px 'Be Vietnam Pro'")]).then(draw).catch(function(){})}
})();
</script>
</body>
</html>
